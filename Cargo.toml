[package]
name = "pagecatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "播放页解析与批量视频下载服务"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
html-escape = "0.2"
libc = "0.2"
percent-encoding = "2"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-util = "0.7"
url = "2"

